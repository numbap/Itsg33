# Continuous accessibility and security compliance, and GitHub Pages publishing.
#
# On every push and pull request:
#   1. run unit tests and the browser security checks (Protected B safeguards)
#   2. run the accessibility suite (axe-core + scripted WCAG checks) on every page state
#   3. recompile the VPAT, accessibility statement and test report from the results
#   4. upload them as the "accessibility-vpat" artifact
#   5. on pushes, commit the recompiled documentation back to the branch if it changed
#   6. fail the workflow if any automated check failed (make this check required in
#      branch protection to block merging non-conformant changes)
#
#
# Pushes to the default branch that pass every check are published to GitHub Pages.
# One-time setup by a repository admin: Settings → Pages → Source: "GitHub Actions".

name: Accessibility (VPAT)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vpat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: Build documentation and policy pages
        run: node scripts/build-vpat.mjs

      - name: Browser security checks (Protected B safeguards)
        run: npm run test:security

      - name: Accessibility test suite
        id: suite
        continue-on-error: true
        run: node tests/a11y/run.mjs

      - name: Recompile VPAT from results
        run: node scripts/build-vpat.mjs

      - name: Record build provenance for the artifact
        run: |
          cat > accessibility/results/build-info.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "run": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "suiteOutcome": "${{ steps.suite.outcome }}"
          }
          EOF

      - name: Upload VPAT and evidence
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-vpat
          path: accessibility/
          retention-days: 90

      - name: Commit recompiled VPAT
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          git add accessibility
          if git diff --cached --quiet; then
            echo "VPAT unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(a11y): recompile VPAT for ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Enforce accessibility gate
        if: steps.suite.outcome != 'success'
        run: |
          echo "::error::Accessibility suite failed. The VPAT has been recompiled with the affected criteria downgraded; see the accessibility-vpat artifact."
          node scripts/build-vpat.mjs --strict

  pages:
    # Publish only builds that passed every check, and only from the default branch.
    needs: vpat
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The branch head, which includes the recompiled VPAT if the vpat job committed one.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Assemble the static site (application, policies, accessibility documentation)
        run: |
          mkdir _site
          cp -r index.html css js policies accessibility LICENSE _site/
          rm -f _site/policies/*.md
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
