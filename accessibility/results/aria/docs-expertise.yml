- main:
  - heading "Evaluator expertise and independence" [level=1]
  - paragraph: A VPAT is only as credible as the people and process behind it. This section discloses both plainly.
  - heading "1. Who performed the evaluation" [level=2]
  - paragraph:
    - text: The initial evaluation (version 1.1.0, 2026-10-15) was carried out by
    - strong: Claude, an AI coding assistant made by Anthropic
    - text: ", working in the project repository at the request of the product owner. In the same session Claude:"
  - list:
    - listitem: designed and wrote the automated accessibility test suite
    - listitem:
      - text: ran a baseline audit, fixed the issues found, and re-ran the suite (see
      - code: remediation-log.html
      - text: )
    - listitem:
      - text: performed the code review, visual inspection and accessibility tree review described in
      - code: methodology.html
    - listitem: wrote the evaluation data, this evidence pack and the VPAT generator.
  - heading "2. Relevant expertise" [level=2]
  - list:
    - listitem: The evaluation applies the published WCAG 2.2 success criteria and their Understanding documents, the WAI-ARIA Authoring Practices patterns (tabs, live regions), and EN 301 549 v3.2.1.
    - listitem:
      - text: The evaluator holds
      - strong: no professional accessibility certification
      - text: ": not IAAP CPACC, WAS or CPWA, Trusted Tester, or equivalent. An AI system cannot hold these credentials."
    - listitem:
      - text: The evaluator
      - strong: cannot operate assistive technology
      - text: or bring the lived experience of a person with a disability. Findings about the experience of screen reader, magnification, voice-control or switch users are inferred from conformance and from the accessibility tree, not observed.
  - heading "3. Independence" [level=2]
  - paragraph:
    - text: The evaluation is
    - strong: not independent
    - text: . The same agent built the features, wrote the tests and judged conformance. This is a self-assessment and should be treated with the same caution as any vendor's first-party VPAT.
  - paragraph: "Safeguards that reduce this risk:"
  - list:
    - listitem:
      - strong: Machine-checkable claims are verified by tools
      - text: (axe-core and scripted checks) on every commit, and the VPAT is generated from those results rather than written by hand. A failing check automatically downgrades the claim.
    - listitem:
      - strong: The baseline audit is kept
      - text: (
      - code: baseline-results.json
      - text: ) so a reviewer can see that the tests found real defects before fixes and were not written to pass.
    - listitem:
      - strong: Manual judgements are tied to a code fingerprint.
      - text: The VPAT flags them as pending re-review when the user interface changes.
    - listitem:
      - strong: Limitations are stated explicitly
      - text: in the VPAT notes and in
      - code: methodology.html
      - text: .
  - heading "4. Recommended independent verification" [level=2]
  - paragraph: "Before relying on this VPAT for a procurement or compliance decision, a qualified, independent reviewer should:"
  - list:
    - listitem: Test the key tasks (scope, questionnaire, report) with at least NVDA + Firefox, JAWS + Chrome, VoiceOver + Safari (macOS and iOS), and Windows high contrast mode.
    - listitem: Spot-check this report's judgement criteria (1.3.1, 1.3.3, 2.4.6, 3.3.x).
    - listitem: Include users with disabilities in usability testing.
    - listitem:
      - text: Record the review with
      - code: npm run a11y:attest -- --reviewer "Name, credential, organization" --notes "Scope of review"
      - text: . The reviewer's name then appears in the VPAT.
  - heading "5. Review record" [level=2]
  - region "Table 1, scrollable":
    - table:
      - rowgroup:
        - row "Date Reviewer Type Scope":
          - cell "Date"
          - cell "Reviewer"
          - cell "Type"
          - cell "Scope"
      - rowgroup:
        - 'row "2026-10-15 Claude (Anthropic AI assistant) Self-assessment: automated, scripted and code review Version 1.1.0, all page states in scope.html"':
          - cell "2026-10-15"
          - cell "Claude (Anthropic AI assistant)"
          - 'cell "Self-assessment: automated, scripted and code review"'
          - cell "Version 1.1.0, all page states in scope.html":
            - text: Version 1.1.0, all page states in
            - code: scope.html
  - paragraph:
    - text: The current attested review is recorded in
    - code: accessibility/evaluation/manual-review.json
    - text: and shown in the VPAT header.
