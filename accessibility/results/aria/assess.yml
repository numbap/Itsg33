    - tabpanel "Go & see":
      - paragraph: "Go to where the work happens. Ask for these, or look yourself:"
      - list:
        - listitem: Export the account list from the admin console. Count accounts with no login in the last 90 days.
        - listitem: Pick someone who left recently and check their account was disabled on their last day.
        - listitem: Search for generic accounts (admin, test, support, training) and service accounts that can log in interactively.
        - listitem: "Ask for the last access review record: who reviewed, what was removed and when."
