- main:
  - heading "Evaluation scope and context" [level=1]
  - heading "1. Product context" [level=2]
  - paragraph: The ITSG-33 Compliance Navigator is a client-side web application. Security practitioners, system owners and vendors use it to scope a software product against ITSG-33 security controls, review product documentation, answer a questionnaire and generate a compliance report.
  - list:
    - listitem:
      - strong: "Users:"
      - text: Government of Canada security and IT staff, vendors and consultants. Users may rely on keyboards, screen readers, magnification, high contrast or dark modes, or voice control.
    - listitem:
      - strong: "Technology:"
      - text: HTML, CSS and JavaScript ES modules with no third-party runtime libraries. The application runs entirely in the browser and keeps its data in the browser's local storage. There is no server-side processing, authentication or third-party content.
    - listitem:
      - strong: "Accessibility-supported technologies relied upon:"
      - text: HTML, CSS, JavaScript and WAI-ARIA 1.2.
  - heading "2. In scope" [level=2]
  - paragraph:
    - text: The whole web interface of the version under evaluation, in every view and in the states listed below. The automated suite runs every listed state. The full list with URLs is in the generated test report (
    - code: test-report.html
    - text: ).
  - region "Table 1, scrollable":
