  - heading "3. Out of scope" [level=2]
  - list:
    - listitem:
      - strong: Files the product generates
      - text: (Markdown, CSV and JSON downloads, and PDFs printed by the browser). These are reported under EN 301 549 chapter 10 as Not Evaluated.
    - listitem:
      - strong: "Browser-provided user interface:"
      - text: native file pickers, confirmation dialogs, date pickers and title tooltips.
    - listitem:
      - strong: Third-party sites linked from the product
      - text: (for example the GitHub issue tracker).
    - listitem:
      - strong: WCAG Level AAA.
