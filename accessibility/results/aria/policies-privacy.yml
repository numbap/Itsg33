  - paragraph:
    - text: If you choose
    - strong: Not saved
    - text: ", the application writes only your settings; the assessment exists only in the open tab."
  - paragraph: The assessment can include product details, your questionnaire answers, notes, remediation plans and any documentation text you paste for review. Your passphrase is never stored. The encryption key is held only in memory while the assessment is unlocked.
  - heading "Files you download" [level=2]
  - paragraph: Reports (Markdown, CSV, printouts) and exported assessment files are created on your device and saved wherever your browser saves downloads. You control those files. Encrypted exports can only be opened with the passphrase you choose for them.
  - heading "The hosting provider" [level=2]
  - paragraph:
    - text: When the application is used from GitHub Pages, your browser downloads the application's files from GitHub. Like any web server, GitHub receives standard request information (your IP address, browser user agent, the files requested and the time) and may record it under the
    - link "GitHub General Privacy Statement":
      - /url: https://docs.github.com/site-policy/privacy-policies/github-general-privacy-statement
    - text: . GitHub does
    - strong: not
    - text: receive anything you type, paste, upload or save in the application.
  - paragraph: Organizations that want no external requests at all can host their own copy of the application (see the README); the application then makes no requests outside that host.
  - heading "Links to other sites" [level=2]
  - paragraph:
    - text: "The footer links to the project's issue tracker on GitHub for reporting accessibility problems. Following it takes you to GitHub, whose own privacy statement applies. Issue reports may be public:"
    - strong: do not include assessment content or any Protected or sensitive information in a report.
  - heading "Deleting your data" [level=2]
  - list:
    - listitem:
      - text: "In the application:"
      - strong: Data and security → Erase all data from this browser
      - text: removes every key listed above.
    - listitem: "In your browser: clearing site data for the application's address also removes it."
    - listitem: Downloaded files must be deleted separately.
  - paragraph: For Protected information, also follow your department's procedures for disposing of information and sanitizing devices.
  - heading "Personal information" [level=2]
  - paragraph:
    - text: The application does not collect personal information. Anything personal you type into an assessment stays on your device under your control. If a department deploys or modifies the application, the department is responsible for assessing its own privacy obligations, for example under the
    - emphasis: Privacy Act
    - text: .
  - heading "Changes to this policy" [level=2]
  - paragraph: Changes are made in the public source repository, so the history of this policy can be reviewed there. The effective date above is updated when the policy changes.
  - heading "Contact" [level=2]
  - paragraph:
    - text: Questions about this policy can be raised through the project's
    - link "issue tracker":
      - /url: https://github.com/numbap/Itsg33/issues
    - text: . Do not include sensitive information.
