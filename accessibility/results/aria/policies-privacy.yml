  - heading "Summary" [level=2]
  - list:
    - listitem:
      - text: The ITSG-33 Compliance Navigator is an
      - strong: open source
      - text: application that runs
      - strong: entirely in your web browser
      - text: (client side).
    - listitem:
      - strong: It does not send anything you enter to any server
      - text: ": not to the project, not to GitHub, and not to any third party. There are no accounts, analytics, advertising, tracking pixels, third-party scripts or web fonts."
    - listitem:
      - strong: What you save stays in your browser's local storage on your device
      - text: ", encrypted unless you choose otherwise for Unclassified work."
      - strong: The application does not set or read cookies.
    - listitem: You can erase everything the application has stored at any time.
  - heading "How we make sure nothing is transmitted" [level=2]
  - list:
    - listitem: The application is made of static files (HTML, CSS and JavaScript). After your browser downloads them, all processing (scoping, document analysis, scoring, report generation and encryption) happens on your device.
    - listitem:
      - text: Every page declares a
      - strong: Content Security Policy
      - text: with
      - code: connect-src 'none'
      - text: and
      - code: form-action 'none'
      - text: . This instructs your browser to block the page from opening any network connection or submitting any form, even if the code were changed to try. The pages also set
      - code: referrer
      - text: to
      - code: no-referrer
      - text: ", so following a link does not reveal which page you came from."
    - listitem:
      - text: The project's automated tests fail the build if the application code contains any network or cookie API (
      - code: fetch
      - text: ","
      - code: XMLHttpRequest
      - text: ","
      - code: WebSocket
      - text: ","
      - code: sendBeacon
      - text: ","
      - code: document.cookie
      - text: ", and similar), or if the Content Security Policy is weakened."
  - heading "What is stored on your device" [level=2]
  - paragraph:
    - text: Everything is stored with the browser's
    - code: localStorage
    - text: for the address the application is served from. Nothing is stored in cookies,
    - code: sessionStorage
    - text: or IndexedDB.
