  - heading "4. Corrections to the test harness" [level=2]
  - paragraph: "Two baseline failures were caused by the harness rather than the product. The corrections are recorded here for transparency:"
  - list:
    - listitem:
      - strong:
        - text: Links inside a collapsed
        - code: <details>
        - text: were counted as unreachable.
      - text: Chromium still reports layout boxes for them. The visibility test now excludes content of closed
      - code: details
      - text: elements (except the summary).
    - listitem:
      - strong: On deep-linked pages, keyboard traversal started mid-page.
      - text: The browser's sequential-focus starting point followed the scrolled-to control. Traversal now starts from a temporary element at the top of the document, as a user arriving on the page would.
  - paragraph:
    - text: After the tabs pattern was implemented, the reachability check was also changed to skip elements with
    - code: tabindex="-1"
    - text: . Inactive tabs are intentionally outside the Tab sequence, and their arrow-key access is verified separately by the tabs-pattern check.
