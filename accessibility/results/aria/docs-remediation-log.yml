  - paragraph:
    - text: The automated suite was first run against version 1.0.0, before any accessibility work, on 2026-10-15. The raw results are kept in
    - code: baseline-results.json
    - text: (an earlier schema of the results format). Out of 131 scripted checks, 90 passed; axe-core reported 8 WCAG violations and 4 best-practice issues across 16 runs.
  - paragraph: The tables below record each finding, its cause, the fix and how it was verified. Every fix was verified by re-running the full suite. The final run passed with no WCAG violations and every scripted check passing.
