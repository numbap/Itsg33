  - heading "1. Conformance target" [level=2]
  - paragraph: "The product's web interface and its accessibility documentation pages target:"
  - list:
    - listitem:
      - strong: WCAG 2.2 Level A and AA
      - text: (W3C Recommendation). This also meets WCAG 2.1 and 2.0 A and AA, which WCAG 2.2 is backwards compatible with (4.1.1 Parsing is reported separately).
    - listitem:
      - strong: EN 301 549 v3.2.1
      - text: ", the standard used in Canadian and European ICT procurement. Its Canadian adoption is CAN/ASC-EN 301 549:2024. Chapter 9 of EN 301 549 incorporates WCAG 2.1 A and AA for web content."
  - paragraph: WCAG Level AAA is not targeted, though several AAA practices are followed (for example, reduced motion support). Government of Canada teams should confirm which policy instruments apply to their use of the product at the time of procurement.
  - heading "2. Principles" [level=2]
  - list:
    - listitem:
      - strong: Native first.
      - text: Use native HTML elements (buttons, links, radio buttons,
      - code: details
      - text: /
      - code: summary
      - text: ", tables) before ARIA. ARIA is used only for patterns HTML lacks (tabs, live regions,"
      - code: aria-current
      - text: ","
      - code: aria-pressed
      - text: ).
    - listitem:
      - strong: Shift left.
      - text: Accessibility is a definition-of-done criterion for every change, not a pre-release audit.
    - listitem:
      - strong: Automate what is reliably automatable; review the rest.
      - text: Automated checks block regressions on every commit. Criteria that need human judgement are evaluated manually and re-reviewed whenever the user interface changes (section 4).
    - listitem:
      - strong: Honest reporting.
      - text: The VPAT reports what the evidence supports. When automated evidence contradicts a manual judgement, the generator automatically downgrades that criterion. Limitations of the evaluation are disclosed (see
      - code: expertise.html
      - text: ).
  - heading "3. Continuous compliance pipeline" [level=2]
  - paragraph:
    - text: Every push and pull request runs
    - code: .github/workflows/accessibility.yml
    - text: ":"
  - list:
    - listitem:
      - text: Unit tests (
      - code: npm test
      - text: ).
    - listitem:
      - text: The accessibility test suite (
      - code: tests/a11y/run.mjs
      - text: "): axe-core across every page state in light and dark themes, plus scripted checks for keyboard access, focus visibility, focus obscuring, reflow, text spacing, target size, non-text contrast, the ARIA tabs pattern, focus management and status messages."
    - listitem:
      - strong: VPAT recompilation
      - text: (
      - code: scripts/build-vpat.mjs
      - text: "): the VPAT, accessibility statement and test report are regenerated from the evaluation data ("
      - code: accessibility/evaluation/criteria.mjs
      - text: ) and the new test results.
    - listitem: On pushes, regenerated documentation that differs from the committed copy is committed back to the branch automatically, so the VPAT in the repository always matches the code it describes.
    - listitem:
      - text: The workflow
      - strong: fails
      - text: if any automated check fails. The recompiled VPAT will then show the affected criteria as “Partially Supports” with the failure in the remarks. To block merging non-conformant changes, make this check required in branch protection.
  - paragraph:
    - text: The run's documentation and raw results are attached to every workflow run as an artifact named
    - code: accessibility-vpat
    - text: .
  - heading "4. Manual review and drift detection" [level=2]
  - paragraph:
    - text: Some criteria cannot be decided by tools (for example 1.3.3, 2.4.6, 3.3.3). The manual evaluation is recorded in
    - code: accessibility/evaluation/manual-review.json
    - text: ", together with a fingerprint (SHA-256 hash) of the user-interface source files it covered."
  - paragraph:
    - text: When any of those files changes, the generator marks the VPAT with
    - strong: “Manual review pending”
    - text: "and names the changed files. The automated results stay current, but the manual judgements must be confirmed by a reviewer, who then runs:"
  - code: npm run a11y:attest -- --reviewer "Name, role/credential" --notes "What was reviewed"
  - paragraph: "This records the review against the new fingerprint. Required cadence: before each release, and at least every six months."
  - heading "5. Roles" [level=2]
  - region "Table 2, scrollable":
    - table:
      - rowgroup:
        - row "Role Responsibility":
          - cell "Role"
          - cell "Responsibility"
      - rowgroup:
