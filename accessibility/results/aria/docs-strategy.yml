          - cell "Contributors"
          - cell "Meet the definition of done; run npm run a11y locally for UI changes":
            - text: Meet the definition of done; run
            - code: npm run a11y
            - text: locally for UI changes
        - row "Maintainers Keep the CI gate required; triage accessibility issues as defects of the same severity as functional bugs":
          - cell "Maintainers"
          - cell "Keep the CI gate required; triage accessibility issues as defects of the same severity as functional bugs"
        - row "Accessibility reviewer Perform and attest manual reviews; recommended to hold IAAP CPACC/WAS or equivalent (see expertise.html)":
          - cell "Accessibility reviewer"
          - cell "Perform and attest manual reviews; recommended to hold IAAP CPACC/WAS or equivalent (see expertise.html)":
            - text: Perform and attest manual reviews; recommended to hold IAAP CPACC/WAS or equivalent (see
            - code: expertise.html
            - text: )
  - heading "6. Definition of done for UI changes" [level=2]
  - list:
    - listitem:
      - code: npm run a11y
      - text: passes locally or in CI.
    - listitem: New interactive patterns use native elements or a documented ARIA pattern, and have a scripted check if they are custom.
    - listitem: New colours are added as tokens in both themes and pass contrast checks.
    - listitem:
      - text: Any new page state is added to
      - code: APP_STATES
      - text: in
      - code: tests/a11y/run.mjs
      - text: .
    - listitem:
      - text: A manual review is attested if the change affects criteria marked
      - code: code-review
      - text: or
      - code: visual
      - text: in the evaluation data.
  - heading "7. Defect handling" [level=2]
  - paragraph: "Accessibility problems are reported through the repository's issue tracker (linked in the footer of every page). They are prioritized as follows:"
  - region "Table 3, scrollable":
    - table:
      - rowgroup:
        - row "Severity Example Target":
          - cell "Severity"
          - cell "Example"
          - cell "Target"
      - rowgroup:
        - row "Blocker A task cannot be completed with keyboard or screen reader Fix before next release":
          - cell "Blocker"
          - cell "A task cannot be completed with keyboard or screen reader"
          - cell "Fix before next release"
        - row "Serious WCAG A/AA failure with a workaround Within 30 days":
          - cell "Serious"
          - cell "WCAG A/AA failure with a workaround"
          - cell "Within 30 days"
        - row "Moderate Best-practice issue or AAA improvement Planned in backlog":
          - cell "Moderate"
          - cell "Best-practice issue or AAA improvement"
          - cell "Planned in backlog"
  - paragraph: Any known non-conformance is disclosed in the VPAT remarks until fixed.
