    - listitem:
      - text: Rules are mapped to success criteria through axe's
      - code: wcagNNN
      - text: tags.
    - listitem: A violation of any WCAG-tagged rule fails the build and downgrades the mapped criterion in the VPAT.
    - listitem: Best-practice violations are reported as advisory and do not affect conformance.
    - listitem: “Incomplete” results (where axe needs human review) are listed in the test report for the reviewer.
