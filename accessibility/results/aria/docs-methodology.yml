  - heading "4. Manual procedures" [level=2]
  - paragraph:
    - strong: Code review.
    - text: For each criterion marked
    - code: code-review
    - text: ", the evaluator inspected the relevant templates and handlers: semantics of each component, error messages, confirmation before destructive actions, change-of-context behaviour, language, and timing."
  - paragraph:
    - strong: Visual inspection.
    - text: "Screenshots were reviewed for: legibility and contrast in both themes; layout at 320 px; visible focus indicators; selected-state cues that do not depend on colour (check marks); and forced-colours rendering (selection uses system Highlight colours, focus uses an outline)."
  - paragraph:
    - strong: Accessibility tree.
    - text: The YAML snapshots in
    - code: results/aria/
    - text: "show each state's roles, names and states as exposed to assistive technology. They were reviewed for meaningful names (for example, “Apply: Where does it run?” instead of repeated “Apply”) and correct roles (tablist, tab, tabpanel, radio, status)."
  - heading "5. Reproducing the results" [level=2]
  - code: "npm ci npx playwright install chromium # unless a Chromium is already available npm run a11y # build docs, run the suite, rebuild the VPAT in strict mode"
  - paragraph:
    - text: The results are written to
    - code: accessibility/results/automated-results.json
    - text: ". Given the same code and tool versions, runs are deterministic: the fixture data and viewports are fixed and no timestamps are recorded."
  - heading "6. Limitations" [level=2]
  - paragraph:
    - text: The following were
    - strong: not
    - text: "performed. A third party should weigh them when relying on this report:"
  - list:
    - listitem:
      - strong: No testing with assistive technology.
      - text: No testing was done with JAWS, NVDA, VoiceOver, TalkBack, Dragon or switch access, or by people with disabilities. The accessibility tree snapshots show what is exposed to assistive technology, but not how a particular screen reader announces it.
    - listitem:
      - strong: Single browser engine.
      - text: Testing used Chromium only. Firefox and Safari were not tested.
    - listitem:
      - strong: Rendering-dependent checks are heuristic.
      - text: The focus-obscured and clipping checks sample points and overflow properties; they can miss partial overlaps.
    - listitem:
      - strong: Emulated zoom.
      - text: Reflow and resize were tested with narrow viewports rather than real browser zoom or text-only zoom.
    - listitem:
      - strong: Judgement criteria.
      - text: Criteria such as 2.4.6 and 3.3.3 depend on human judgement. They are re-reviewed when the user interface changes (see the strategy, section 4), but are not re-verified automatically on each commit.
  - paragraph: An independent audit that includes assistive technology testing is recommended before relying on this VPAT for procurement decisions.
