      - listitem: Business case or project charter
      - listitem: Departmental security control profile
    - heading "Tasks" [level=3]
    - list:
      - listitem: Describe the business processes the system supports and the services that depend on it.
      - listitem: Identify user populations (public, employees, partners, administrators) and where they connect from.
      - listitem: List interconnections with other systems, identity providers and external services.
      - listitem: "Draw the system boundary: what is in scope, what is inherited, what is someone else's system."
      - listitem: Name the authorizer (the person who will accept residual risk) and the assessor early.
    - heading "Outputs and artefacts" [level=3]
