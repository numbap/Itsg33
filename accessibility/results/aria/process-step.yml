    - paragraph: Before any control can be selected you need to know what the system does, who uses it, what it connects to and where its boundary is. This is the foundation of the concept of operations and of the System Security Plan.
    - heading "Who" [level=3]
    - list:
      - listitem: Business owner
      - listitem: Project manager
      - listitem: IT security practitioner (ISSO)
      - listitem: Solution architect
    - heading "Inputs" [level=3]
