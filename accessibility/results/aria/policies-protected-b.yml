  - heading "3. Safeguards in detail" [level=2]
  - heading "3.1 No transmission of information" [level=3]
  - list:
    - listitem: The application is static HTML, CSS and JavaScript. All processing (including the review of pasted documentation) happens in the browser tab.
    - listitem:
      - text: Each page declares a
      - strong: Content Security Policy
      - text: ":"
      - code: default-src 'none'; connect-src 'none'; form-action 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; object-src 'none'
      - text: . The browser therefore blocks network connections, form submissions, inline and remote scripts, and remote content, even if an attacker managed to inject markup.
      - code: referrer
      - text: is set to
      - code: no-referrer
      - text: .
    - listitem: There are no third-party libraries at run time, no analytics, no fonts or images from other sites, and no cookies.
    - listitem:
      - text: Automated tests fail the build if the client code uses any network or cookie API, or if the Content Security Policy is weakened. A browser test confirms that
      - code: fetch
      - text: is blocked.
  - heading "3.2 Encryption at rest" [level=3]
  - list:
    - listitem:
      - strong: "Cipher:"
      - text: AES-256 in GCM mode (authenticated encryption), with a new random 96-bit IV for every save.
    - listitem:
      - strong: "Key derivation:"
      - text: PBKDF2-HMAC-SHA-256, 600,000 iterations, random 128-bit salt. Envelopes with fewer than 100,000 iterations are refused.
    - listitem: AES and SHA-256 are among the algorithms ITSP.40.111 approves for Protected B. PBKDF2 is the password-based key derivation function in NIST SP 800-132.
    - listitem:
      - text: Keys are created as
      - strong: non-extractable
      - text: Web Crypto keys and exist only in memory while unlocked. The passphrase is never stored.
    - listitem: The security marking and key-derivation parameters are bound to the ciphertext as authenticated data, so they cannot be altered without detection.
    - listitem:
      - strong: "Policy enforcement in code:"
      - text: the storage layer refuses to write a Protected A or Protected B assessment to browser storage unencrypted. Unit tests verify this.
    - listitem:
      - text: Choosing
      - strong: Not saved
      - text: keeps the assessment only in the tab's memory.
  - heading "3.3 Access to the stored assessment" [level=3]
  - list:
    - listitem: Unlocking requires the passphrase (at least 15 characters). Password managers and pasting are supported, as WCAG 2.2 criterion 3.3.8 requires.
    - listitem:
      - strong: Auto-lock
      - text: after 15 minutes of inactivity by default, adjustable from 15 minutes to 8 hours or off.
      - strong: Lock
      - text: is always available in the header. Locking clears the decrypted assessment from the page.
    - listitem: The application refuses to run inside a frame, which prevents other pages from embedding it and reading decrypted content.
  - heading "3.4 Marking" [level=3]
  - list:
    - listitem:
      - text: A banner at the top of every screen shows the marking (for example
      - strong: PROTECTED B
      - text: ), the storage mode and “Data stays on this device”.
    - listitem:
      - text: Reports show the marking at the top and bottom. Printouts repeat it at the top right and bottom of
      - strong: every page
      - text: .
    - listitem:
      - text: Downloaded file names include the marking (for example
      - code: …-PROTECTED-B.md
      - text: ). Markdown and CSV files start with the marking, and encrypted files carry it in their authenticated header.
  - heading "3.5 Exporting and moving information" [level=3]
  - list:
    - listitem:
      - strong: Encrypted export
      - text: uses a separate passphrase you choose, so the file can be moved without revealing your browser passphrase. Send the passphrase by a different channel from the file.
    - listitem: Reports in Markdown or CSV and unencrypted JSON exports cannot be encrypted by the application. When the marking is Protected, the application asks you to confirm before downloading and reminds you to store the file only on approved systems.
  - heading "3.6 Disposal" [level=3]
  - list:
    - listitem:
      - strong: Data and security → Erase all data from this browser
      - text: removes every item the application stores.
    - listitem: Because stored assessments are encrypted, removing the encrypted data and forgetting the key leaves any remnants on disk unreadable (cryptographic erasure).
