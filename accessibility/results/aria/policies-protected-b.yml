  - paragraph: This page explains how the application is designed to protect Protected B information, how that maps to Government of Canada security requirements, and what must be true of your environment for those protections to hold. The caveats in section 5 are part of the statement, not footnotes.
  - blockquote:
    - paragraph:
      - strong: Protected B
      - text: applies to information whose compromise could reasonably be expected to cause serious injury to an individual, organization or government. An ITSG-33 assessment of a Protected B system usually describes that system's weaknesses, so the assessment itself should normally be treated as Protected B. The application therefore uses
      - strong: Protected B
      - text: as the default marking.
  - heading "1. Requirements framework" [level=2]
  - paragraph: "The design responds to:"
  - list:
    - listitem:
      - text: the
      - strong: Policy on Government Security
      - text: and the
      - strong: Directive on Security Management
      - text: (Treasury Board), which require departments to protect information according to its security category and to manage risks to information systems
    - listitem:
      - strong: ITSG-33
      - text: ","
      - emphasis: "IT Security Risk Management: A Lifecycle Approach"
      - text: (Canadian Centre for Cyber Security), whose controls are used in section 4 to describe the application's own safeguards
    - listitem:
      - strong: ITSP.40.111
      - text: ","
      - emphasis: Cryptographic Algorithms for UNCLASSIFIED, PROTECTED A, and PROTECTED B Information
      - text: (CCCS)
    - listitem:
      - strong: ITSP.40.006
      - text: ","
      - emphasis: IT Media Sanitization
      - text: (CCCS), for disposal.
  - paragraph: Departmental security policies and standards take precedence. Your Departmental Security Officer (DSO) and IT security team decide whether, and under what conditions, the application may be used with Protected B information.
