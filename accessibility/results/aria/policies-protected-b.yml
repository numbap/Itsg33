  - heading "5. Caveats and dependencies" [level=2]
  - paragraph:
    - text: These conditions are
    - strong: required
    - text: for the safeguards above to be meaningful. Several depend on how and where the application is deployed, or on permissions the application cannot control.
  - heading "5.1 The device" [level=3]
  - paragraph:
    - text: Use the application only on a
    - strong: Government of Canada-managed device that is authorized for Protected B
    - text: ", with full-disk encryption, current patches, endpoint protection and an enforced screen lock. Do not use personal or shared devices. Browser storage lives in the user's browser profile on disk. The application's encryption is defence in depth,"
    - strong: not a substitute for device encryption
    - text: .
  - paragraph:
    - strong: Browser extensions
    - text: can read the content of any page, including decrypted assessments. Departments should restrict extensions on devices used for Protected B.
  - heading "5.2 Where the code comes from (hosting and origin)" [level=3]
  - list:
    - listitem:
      - strong: GitHub Pages is not a departmental service.
      - text: It serves only the application's code; it never receives assessment content. However, whoever controls the repository controls the code your browser runs. A compromised or malicious change could remove these safeguards. Use a reviewed version.
    - listitem:
      - text: "On"
      - code: github.io
      - text: ","
      - strong: every GitHub Pages site under the same account shares one origin
      - text: (for example
      - code: https://numbap.github.io
      - text: ), and so shares browser storage. Other sites under that account could read the encrypted data (but not decrypt it), delete it, or replace it. GCM authentication detects replacement.
    - listitem:
      - text: GitHub Pages cannot send custom HTTP security headers (such as
      - code: frame-ancestors
      - text: ","
      - code: X-Content-Type-Options
      - text: ", or a header-delivered CSP). The application compensates with a"
      - code: <meta>
      - text: CSP and a frame check in code, which offer less protection.
    - listitem:
      - strong: "Recommendation for Protected B use:"
      - text: the department should host a reviewed, version-pinned copy on its own infrastructure or approved hosting, on a
      - strong: dedicated origin
      - text: (its own host name) with security headers set by the server. Running
      - code: npm start
      - text: serves the application locally.
  - heading "5.3 Cryptographic module validation" [level=3]
  - paragraph:
    - text: The application uses the browser's built-in Web Crypto implementation. Whether this is a
    - strong: CMVP-validated (FIPS 140-2/140-3) module
    - text: depends on the browser, operating system and configuration, and
    - strong: generally cannot be guaranteed
    - text: . If departmental standards require validated cryptography for Protected B at rest (ITSG-33 IA-7 and SC-13), rely on the device's validated full-disk encryption as the primary control.
  - heading "5.4 Passphrases" [level=3]
  - list:
    - listitem: Protection is only as strong as the passphrase. The minimum length is enforced; strength beyond that is not measured.
    - listitem:
      - text: There is
      - strong: no passphrase recovery
      - text: . A forgotten passphrase means the stored assessment is lost; keep encrypted exports as backups.
    - listitem: There is no lockout after failed attempts. Someone with a copy of the browser profile can try passphrases offline; the 600,000-iteration key derivation slows this down but cannot prevent it.
  - heading "5.5 Memory and remnants" [level=3]
  - paragraph: JavaScript cannot reliably wipe memory. While an assessment is unlocked, and for some time after, decrypted content may remain in memory, the page file, hibernation files or crash dumps. Full-disk encryption and departmental sanitization procedures (ITSP.40.006) address these copies. Browser backups, roaming profiles or synchronized folders may copy the encrypted data; check departmental configuration.
  - heading "5.6 Files you create" [level=3]
  - paragraph:
    - text: Markdown and CSV reports, unencrypted JSON exports, printouts and browser-generated PDFs are
    - strong: not encrypted
    - text: . Store them only in repositories approved for Protected B, mark them, and send them only through approved channels (for example, departmental Protected B-approved collaboration systems or encrypted email). Check that the browser's download folder is not synchronized to an unapproved cloud service. Content copied to the clipboard may be visible to other applications or clipboard history.
  - heading "5.7 No audit trail" [level=3]
  - paragraph: The application records no log of who opened or changed an assessment, so it does not meet ITSG-33 audit requirements (AU family) for systems of record. Use it as a working tool, and keep authoritative records in departmental systems.
  - heading "5.8 User responsibilities" [level=3]
  - paragraph:
    - text: The marking reflects what the user selects. Choosing a marking does not, by itself, make handling compliant. Users must follow departmental rules on need-to-know, storage, transmission and disposal.
    - strong: Protected C and classified information are not supported.
  - heading "5.9 Status of this statement" [level=3]
  - paragraph:
    - text: This statement was prepared together with the application's code by an AI assistant (Claude, Anthropic). It is a design statement supported by automated tests,
    - strong: not
    - text: an assessment by a departmental security authority. The application has not undergone a security assessment and authorization (SA&A). Before using it with Protected B information, obtain approval through your department's security process. That process may treat the application as a tool used on an already-authorized endpoint.
