    - paragraph: CaseTrack Software Inc. receives security alerts and advisories from the Canadian Centre for Cyber Security and component vendors and assesses each for impact on CaseTrack Online.
    - strong: SI-7 Software and Information Integrity
    - text: Applicable Not assessed Draft
    - paragraph: CaseTrack Online build artifacts are signed in the pipeline and only signed, verified images are deployed. Production components are immutable and changes are detected.
    - strong: SI-10 Information Input Validation
    - text: Applicable Not assessed Draft
    - paragraph: CaseTrack Online validates all inputs on the server against defined schemas, uses parameterized queries, and encodes outputs to prevent injection attacks.
    - strong: SI-11 Error Handling
    - text: Applicable Not assessed Draft
    - paragraph: CaseTrack Online returns generic error messages to users with a correlation ID; detailed error information is logged only to protected logs.
    - strong: SI-12 Information Handling and Retention
    - text: Applicable Not assessed Draft
    - paragraph: Information in CaseTrack Online is handled and retained according to the departmental retention and disposition schedule. Records past their retention period are disposed of automatically and logged.
    - heading "Methodology and limitations" [level=2]
    - paragraph: UNCLASSIFIED
    - paragraph: This report is a self-assessment against a PBMM-oriented subset of the ITSG-33 Annex 3A security controls (base controls, without enhancements), using paraphrased control descriptions. Applicability is derived from the system profile; status is derived from questionnaire answers or assessor overrides. Scores weight implemented and inherited controls as 1, partial as 0.5, planned as 0.25 and all others as 0. It does not replace a formal security assessment and authorization (SA&A) by your departmental IT security team. Consult the official ITSG-33 publications from the Canadian Centre for Cyber Security for authoritative control text.
