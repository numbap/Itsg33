    - heading "4. Design opportunities (eliminate requirements by design)" [level=2]
    - paragraph: These design choices remove or shrink groups of requirements rather than satisfying them one at a time.
    - list:
      - listitem:
        - strong: Federate sign-in to the departmental identity provider
        - text: ". The product stops handling passwords, lockout, MFA and account lifecycle. Those become the IdP's job, which is already assessed and monitored. Affects AC-2, AC-7, AC-8, AC-11, AC-12, IA-2, IA-4, IA-5, IA-6, PS-4, PS-5 · closes or shrinks 2 current gap(s): AC-2, IA-2"
      - listitem:
        - strong: Replace vendor remote access with customer-approved, time-limited support
        - text: . Removing standing vendor access shrinks remote maintenance and third-party personnel exposure. Affects MA-4, MA-5, PS-3, PS-7, AC-17
      - listitem:
        - strong: Collect and keep less data
        - text: . Data you do not hold cannot be breached. Minimization can lower the security category and shrinks retention and spillage obligations. Affects RA-2, SC-28, SI-12, IR-9, MP-6
