    - 'heading "AC: Access Control" [level=3]'
    - strong: AC-1 Access Control Policy and Procedures
    - text: Applicable Not assessed Draft
    - paragraph: CaseTrack Online follows the CaseTrack Software Inc. access control policy, which is reviewed at least annually. Product-specific procedures implementing the AC controls are documented and available to the staff who perform them.
    - strong: AC-2 Account Management
    - text: Applicable Partially implemented Draft
    - paragraph: "CaseTrack Online accounts are provisioned and removed automatically from the departmental identity provider (federated single sign-on). Access is granted only after the business owner approves the request. Accounts inactive for 90 days are disabled automatically, and the CaseTrack Software Inc. system owner reviews all privileged accounts quarterly. This statement describes the target implementation. Current gaps and remediation are recorded in the plan of action and milestones. Compensating measures: Monthly reconciliation against HR departures."
    - paragraph:
      - emphasis: "Evidence / notes:"
      - text: Reviewed the admin console export.
    - strong: AC-3 Access Enforcement
    - text: Applicable Not assessed Draft
    - paragraph: CaseTrack Online enforces role-based access control on the server side for every request. Roles are derived from the departmental identity provider (federated single sign-on) group membership and mapped to a documented permission matrix. Access is denied by default unless an explicit permission exists.
    - strong: AC-4 Information Flow Enforcement
    - text: Applicable Not assessed Draft
    - paragraph: Information flows in CaseTrack Online are restricted to those shown in the approved data flow diagram. Network security groups deny traffic by default, outbound connections are restricted to an allow-list, and integrations pass through an API gateway that enforces schemas and authentication.
    - strong: AC-5 Separation of Duties
    - text: Applicable Not assessed Draft
    - paragraph: "Duties in CaseTrack Online are separated: production changes require peer review and pass only through the deployment pipeline, privileged role assignments require approval by a second person, and business roles are designed so that no user can both initiate and approve a sensitive transaction."
    - strong: AC-6 Least Privilege
    - text: Applicable Not assessed Draft
    - paragraph: "CaseTrack Online applies least privilege: users receive only the roles needed for their job, administrators use separate privileged accounts that are elevated just in time with MFA, and application components run under scoped identities with only the permissions they require."
    - strong: AC-7 Unsuccessful Logon Attempts
    - text: Inherited Inherited Draft
    - paragraph: Inherited. Enforced by the departmental identity provider when sign-in is fully federated. Authentication for CaseTrack Online is performed by the departmental identity provider (federated single sign-on), which locks or throttles accounts after repeated failed attempts according to departmental policy. CaseTrack Online itself does not accept passwords.
    - strong: AC-8 System Use Notification
    - text: Inherited Inherited Draft
    - paragraph: Inherited. Departmental IdP sign-in page displays the notice. Before access to CaseTrack Online is granted, users see the departmental system use notification on the the departmental identity provider (federated single sign-on) sign-in page, stating that the system is for authorized use only and that activity is monitored.
    - strong: AC-11 Session Lock
    - text: Applicable Not assessed Draft
    - paragraph: CaseTrack Online sessions expire after 15 minutes of inactivity, requiring re-authentication. Departmental endpoints additionally enforce operating system screen lock.
    - strong: AC-12 Session Termination
    - text: Applicable Not assessed Draft
    - paragraph: CaseTrack Online terminates sessions on logout, after an absolute session lifetime, and when the user is disabled in the departmental identity provider (federated single sign-on). Session tokens are invalidated server-side and cannot be replayed.
    - strong: AC-14 Permitted Actions Without Identification or Authentication
    - text: Applicable Not assessed Draft
    - paragraph: The only actions permitted in CaseTrack Online without authentication are viewing the public landing page and the service health endpoint, neither of which returns protected information. All other functions require authentication.
    - strong: AC-17 Remote Access
    - text: Applicable Not assessed Draft
    - paragraph: Remote administrative access to CaseTrack Online is only possible through a managed bastion service that requires MFA, restricts access to managed devices and logs every session. No management ports are exposed to the internet. User access is through the web interface over TLS.
    - strong: AC-18 Wireless Access
    - text: Not applicable Not applicable Draft
    - paragraph: Not applicable. Product does not include or depend on managed wireless networks.
    - strong: AC-19 Access Control for Mobile Devices
    - text: Not applicable Not applicable Draft
    - paragraph: Not applicable. No mobile app or mobile-device access.
    - strong: AC-20 Use of External Information Systems
    - text: Applicable Not assessed Draft
    - paragraph: Access to CaseTrack Online from external systems is governed by departmental conditional access policy. Third-party services that process CaseTrack Online data are documented, contractually bound and approved.
    - strong: AC-22 Publicly Accessible Content
    - text: Not applicable Not applicable Draft
    - paragraph: Not applicable. Product does not publish information publicly.
    - 'heading "AT: Awareness and Training" [level=3]'
    - strong: AT-1 Awareness and Training Policy and Procedures
    - text: Applicable Not assessed Draft
    - paragraph: CaseTrack Online follows the CaseTrack Software Inc. awareness and training policy, which is reviewed at least annually. Product-specific procedures implementing the AT controls are documented and available to the staff who perform them.
    - strong: AT-2 Security Awareness
    - text: Applicable Not assessed Draft
    - paragraph: All CaseTrack Online users complete departmental security awareness training before receiving access and annually thereafter. Completion is tracked in the departmental learning management system.
