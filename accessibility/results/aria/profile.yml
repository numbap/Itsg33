- main:
  - heading "1. Scope the product" [level=1]
  - paragraph: Answer what you know. Each answer changes which ITSG-33 controls apply. The “What this scope means” summary shows the effect as you go.
  - group "The product":
    - text: The product Product or system name
    - textbox "Product or system name":
      - /placeholder: e.g. CaseTrack Online
      - text: CaseTrack Online
    - paragraph: "Why we ask: Used throughout the report and in the draft implementation statements."
    - text: Responsible organization
    - textbox "Responsible organization":
      - /placeholder: e.g. Acme Software Inc. / Department X
      - text: CaseTrack Software Inc.
    - paragraph: "Why we ask: The party that operates the product and owns its controls. Used in implementation statements."
    - text: What does the product do?
    - textbox "What does the product do?":
      - /placeholder: Business purpose, users, the information it handles...
      - text: Cloud case management for departmental program officers handling Protected B client files.
    - paragraph: "Why we ask: A one-paragraph system description is the first thing an assessor reads in a System Security Plan (PL-2)."
  - group "Information sensitivity":
    - text: Information sensitivity Highest sensitivity of information processed
    - radiogroup "Highest sensitivity of information processed":
      - radio "Unclassified"
      - text: Unclassified
      - radio "Protected A"
      - text: Protected A
      - radio "Protected B" [checked]
      - text: Protected B
      - radio "Protected C or classified"
      - text: Protected C or classified
    - paragraph: "Why we ask: ITSG-33's PBMM profile is built for Protected B, Medium integrity, Medium availability. Protected C or classified information needs a stronger profile."
    - text: Integrity needs (injury if information is altered)
    - radiogroup "Integrity needs (injury if information is altered)":
      - radio "Low"
      - text: Low
      - radio "Medium" [checked]
      - text: Medium
      - radio "High"
      - text: High
    - paragraph: "Why we ask: PBMM assumes medium integrity. High integrity needs (e.g. payments, legal records) push you beyond this baseline."
    - text: Availability needs (injury if unavailable)
    - radiogroup "Availability needs (injury if unavailable)":
      - radio "Low"
      - text: Low
      - radio "Medium" [checked]
      - text: Medium
      - radio "High"
      - text: High
    - paragraph: "Why we ask: Drives contingency planning (CP) depth. High availability needs alternate sites and tested failover."
  - group "Operating model":
    - text: Operating model Who operates the product day to day?
    - radiogroup "Who operates the product day to day?":
      - radio "Vendor operates it (SaaS / managed service)" [checked]
      - text: Vendor operates it (SaaS / managed service)
      - radio "We operate it ourselves"
      - text: We operate it ourselves
    - paragraph: "Why we ask: If a vendor operates it (SaaS), many operational controls become the vendor's to evidence and yours to verify."
    - text: Where does it run?
    - radiogroup "Where does it run?":
      - radio "Public cloud, CCCS-assessed, Canadian region" [checked]
      - text: Public cloud, CCCS-assessed, Canadian region
      - radio "Other cloud (not assessed, or outside Canada)"
      - text: Other cloud (not assessed, or outside Canada)
      - radio "Government / departmental data centre"
      - text: Government / departmental data centre
      - radio "Vendor's own data centre"
      - text: Vendor's own data centre
      - radio "Installed on end-user devices only"
      - text: Installed on end-user devices only
    - paragraph: "Why we ask: Hosting in a cloud service assessed by the Canadian Centre for Cyber Security lets you inherit most physical, environmental and media controls."
    - text: Who builds the software?
    - radiogroup "Who builds the software?":
      - radio "We develop it"
      - text: We develop it
      - radio "Vendor builds it to our requirements"
      - text: Vendor builds it to our requirements
      - radio "Commercial off-the-shelf / SaaS" [checked]
      - text: Commercial off-the-shelf / SaaS
      - radio "Open source we deploy"
      - text: Open source we deploy
    - paragraph: "Why we ask: In-house developers must meet secure development controls directly; for vendor products you collect evidence instead."
  - group "People and identity":
    - text: People and identity How do users sign in?
    - radiogroup "How do users sign in?":
      - radio "Federated single sign-on (SAML / OIDC to departmental IdP)" [checked]
      - text: Federated single sign-on (SAML / OIDC to departmental IdP)
      - radio "Product's own usernames and passwords"
      - text: Product's own usernames and passwords
      - 'radio "Both: SSO for staff, local accounts for others"'
      - text: "Both: SSO for staff, local accounts for others"
      - radio "No interactive users (service / batch only)"
      - text: No interactive users (service / batch only)
    - paragraph: "Why we ask: Federating to the departmental identity provider removes most password, lockout and account-lifecycle requirements from the product."
    - text: Who uses it?
    - radiogroup "Who uses it?":
      - radio "Government staff only" [checked]
      - text: Government staff only
      - radio "Public or partners only"
      - text: Public or partners only
      - radio "Both staff and external users"
      - text: Both staff and external users
    - paragraph: "Why we ask: Non-organizational users (public, partners) bring in IA-8 and affect identity assurance and privacy obligations."
  - group "Exposure and connections":
    - text: Exposure and connections Is any part reachable from the internet?
    - radiogroup "Is any part reachable from the internet?":
      - radio "Yes" [checked]
      - text: "Yes"
      - radio "No"
      - text: "No"
    - paragraph: "Why we ask: Internet exposure raises the importance of boundary protection, DoS protection and vulnerability management."
    - text: Does it publish information to the public?
    - radiogroup "Does it publish information to the public?":
      - radio "Yes"
      - text: "Yes"
      - radio "No" [checked]
      - text: "No"
    - paragraph: "Why we ask: Publicly accessible content triggers AC-22: someone must check nothing sensitive gets published."
    - text: Does it exchange data with other systems (APIs, feeds, integrations)?
    - radiogroup "Does it exchange data with other systems (APIs, feeds, integrations)?":
      - radio "Yes" [checked]
      - text: "Yes"
      - radio "No"
      - text: "No"
    - paragraph: "Why we ask: Each interconnection needs an agreement and controlled information flow (CA-3, AC-4)."
    - text: Does vendor support connect remotely for maintenance?
    - radiogroup "Does vendor support connect remotely for maintenance?":
      - radio "Yes" [checked]
      - text: "Yes"
      - radio "No"
      - text: "No"
    - paragraph: "Why we ask: Remote maintenance (MA-4) is a frequent path for compromise and needs strong authentication and session oversight."
    - text: Does the product include or depend on wireless networks you manage?
    - radiogroup "Does the product include or depend on wireless networks you manage?":
      - radio "Yes"
      - text: "Yes"
      - radio "No" [checked]
      - text: "No"
    - paragraph: "Why we ask: If not, wireless access controls (AC-18) are not applicable to the product."
    - text: Is there a mobile app or mobile-device access?
    - radiogroup "Is there a mobile app or mobile-device access?":
      - radio "Yes"
      - text: "Yes"
      - radio "No" [checked]
      - text: "No"
    - paragraph: "Why we ask: Mobile access brings in AC-19 and device management expectations."
    - text: Is information ever exported to removable media (USB, disks, tapes)?
    - radiogroup "Is information ever exported to removable media (USB, disks, tapes)?":
      - radio "Yes"
      - text: "Yes"
      - radio "No" [checked]
      - text: "No"
    - paragraph: "Why we ask: If information never leaves on media, most media protection controls fall to the hosting provider."
