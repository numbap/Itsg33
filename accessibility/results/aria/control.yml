  - text: / SC System and Communications Protection
  - 'heading "SC-28: Protection of Information at Rest" [level=1]'
  - text: Applicable Not assessed high severity
  - paragraph: Protect the confidentiality and integrity of stored information, including databases, files and backups.
  - heading "Go & see" [level=2]
  - paragraph: Where to look and what evidence to ask for.
  - list:
    - listitem: "Check encryption settings on every data store: databases, object storage, disks, backups, search indexes, caches and logs."
    - listitem: Look for copies of production data in test environments or on laptops.
  - heading "Eliminate it by design" [level=2]
  - paragraph: How the product could be implemented so this requirement disappears or shrinks.
  - list:
    - listitem: Use platform encryption at rest enforced by policy (a GC Cloud Guardrail), with customer-managed keys where risk warrants.
    - listitem: Do not copy production data to non-production; use synthetic or masked data.
    - listitem: "Avoid storing data you do not need (data minimization): data never collected needs no protection."
  - heading "If you break it" [level=2]
  - paragraph: Consequences of not meeting this control.
  - list:
    - listitem: Exposure of Protected B data from lost media, misconfigured storage or stolen backups; privacy breach notification obligations.
  - heading "Mitigate" [level=2]
  - paragraph: Compensating measures when full compliance isn't possible yet.
  - list:
    - listitem: Field-level encryption of the most sensitive attributes; strict access to backups.
  - heading "Describe it" [level=2]
  - paragraph: "Draft implementation statement for this product, based on your scoping answers:"
  - blockquote: All CaseTrack Online data at rest, including databases, file storage, backups and logs, is encrypted using AES-256 through platform encryption with keys managed in the key management service. Production data is not copied to non-production environments.
  - paragraph:
    - strong: "Make it assessable:"
    - text: replace generic phrases with the actual tool, setting, frequency and the record that proves it (e.g. “Entra ID Conditional Access policy CA-01 requires MFA for all users; sign-in logs are retained 90 days”).
  - heading "Ask" [level=2]
  - paragraph: Questions to understand whether, and how, the requirement is met.
  - list:
    - listitem: Is all data at rest (databases, files, backups, logs) encrypted?
    - listitem: Is production data kept out of non-production environments (or masked)?
    - listitem: Is encryption at rest enforced by policy so new storage cannot be created unencrypted?
  - paragraph:
    - text: "Look for these terms in vendor documentation:"
    - code: encryption at rest
    - code: at rest
    - code: encrypted storage
    - code: transparent data encryption
    - code: tde
    - code: disk encryption
    - code: aes-256
    - code: data masking
